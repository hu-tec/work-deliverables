<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./styles.css">
  <title>공지사항 상세 | Times Education</title>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="./index.html"><span class="brand-mark">TM</span><span>Times Education<small>AI 교육·자격 통합 플랫폼</small></span></a>
    <nav class="gnb" aria-label="주요 메뉴"><a href="./index.html">홈</a><a href="./courses.html">교육과정</a><a class="active" href="./community.html">커뮤니티</a></nav>
    <div class="header-actions"><button class="mobile-menu" type="button">MENU</button><a class="btn btn--primary btn--sm" href="#">신청하기</a></div>
  </div></header>

  <main id="main">
    <section class="page-hero"><div class="container page-hero-inner">
      <span class="breadcrumb">Home / 커뮤니티 / 공지사항</span><h1>공지사항</h1><p>교육원 공식 안내입니다.</p>
    </div></section>
    <section class="section"><div class="container">
      <article class="notice-view" id="noticeView"></article>
      <div id="noticeNavSlot"></div>
      <div class="detail-actions"><a class="btn btn--outline" href="./community.html#notice">목록으로</a><a class="btn btn--primary" href="#">문의하기</a></div>
    </div></section>
  </main>

  <footer class="site-footer"><div class="container"><div class="footer-grid">
    <div><h2>Times Education</h2><p>02-6207-9090</p></div>
    <div><h3>과정</h3><a href="./courses.html">교육과정 안내</a></div>
    <div><h3>커뮤니티</h3><a href="./community.html">공지·FAQ·후기</a></div>
    <div><h3>지원</h3><a href="#">1:1 문의</a></div>
  </div><div class="copyright">© 2026 Times Media Inc. — Design B</div></div></footer>

  <script src="./data.js"></script>
  <script>
    (function () {
      const { NOTICES, findNotice, getParam, escapeHtml } = window.SiteData;
      const notice = findNotice(getParam("id"));
      const idx = NOTICES.findIndex((n) => n.id === notice.id);
      const prev = NOTICES[idx - 1], next = NOTICES[idx + 1];
      document.title = `${notice.title} | Times Education`;
      const filesHtml = notice.files.length
        ? `<div class="notice-files"><h4>첨부파일</h4>${notice.files.map((f) => `<a href="#">📎 ${escapeHtml(f.name)} (${escapeHtml(f.size)})</a>`).join("")}</div>` : "";
      document.getElementById("noticeView").innerHTML = `
        <div class="notice-view-head">
          <span class="cat-badge" data-cat="${escapeHtml(notice.category)}">${escapeHtml(notice.category)}</span>
          <h2>${escapeHtml(notice.title)}</h2>
          <div class="notice-view-meta"><span>작성자 ${escapeHtml(notice.writer)}</span><span>등록일 ${escapeHtml(notice.date)}</span><span>조회 ${notice.views.toLocaleString()}</span></div>
        </div>
        <div class="notice-view-body">${notice.body.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}${filesHtml}</div>`;
      document.getElementById("noticeNavSlot").innerHTML = `<nav class="notice-nav">
        ${prev ? `<a href="./notice-detail.html?id=${encodeURIComponent(prev.id)}"><span class="dir">이전글</span><span>${escapeHtml(prev.title)}</span></a>` : `<a><span class="dir">이전글</span><span>이전 글이 없습니다.</span></a>`}
        ${next ? `<a href="./notice-detail.html?id=${encodeURIComponent(next.id)}"><span class="dir">다음글</span><span>${escapeHtml(next.title)}</span></a>` : `<a><span class="dir">다음글</span><span>다음 글이 없습니다.</span></a>`}
      </nav>`;
    })();
  </script>
</body>
</html>
