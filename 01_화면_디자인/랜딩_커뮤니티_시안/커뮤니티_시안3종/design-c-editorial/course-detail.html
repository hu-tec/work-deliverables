<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="./styles.css">
  <title>교육과정 상세 | Times Education</title>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="./index.html"><span class="brand-mark">TM</span><span>Times Education<small>AI 교육·자격 통합 플랫폼</small></span></a>
    <nav class="gnb" aria-label="주요 메뉴"><a href="./index.html">홈</a><a class="active" href="./courses.html">교육과정</a><a href="./community.html">커뮤니티</a></nav>
    <div class="header-actions"><button class="mobile-menu" type="button">MENU</button><a class="btn btn--primary btn--sm" href="#">신청하기</a></div>
  </div></header>

  <main id="main">
    <section class="detail-masthead"><div class="container">
      <div class="cat" id="dCat"></div>
      <h1 id="dTitle">교육과정 상세</h1>
      <p id="dSummary"></p>
      <div class="hero-img"><img id="dImg" src="" alt=""></div>
    </div></section>

    <div class="container"><div class="detail-layout">
      <aside class="toc" id="toc" aria-label="목차"></aside>
      <article class="longform" id="longform"></article>
    </div></div>
  </main>

  <section class="cta"><div class="container cta-inner">
    <div><h2>나에게 맞는 과정인지 상담받아보세요</h2><p>학습 목표와 일정에 맞춰 과정과 시험을 안내합니다.</p></div>
    <a class="btn btn--primary btn--lg" href="#">과정 상담하기</a>
  </div></section>
  <footer class="site-footer"><div class="container"><div class="footer-grid">
    <div><h2>Times Education</h2><p>02-6207-9090</p></div>
    <div><h3>과정</h3><a href="./courses.html">교육과정 안내</a></div>
    <div><h3>커뮤니티</h3><a href="./community.html">공지·FAQ·후기</a></div>
    <div><h3>지원</h3><a href="#">1:1 문의</a></div>
  </div><div class="copyright">© 2026 Times Media Inc. — Design C</div></div></footer>

  <script src="./data.js"></script>
  <script>
    (function () {
      const { findCourse, getParam, escapeHtml } = window.SiteData;
      const c = findCourse(getParam("id"));
      document.title = `${c.title} | Times Education`;
      document.getElementById("dCat").textContent = `${c.category} · ${c.status}`;
      document.getElementById("dTitle").textContent = c.title;
      document.getElementById("dSummary").textContent = c.summary;
      const img = document.getElementById("dImg"); img.src = c.image; img.alt = c.title;

      const sections = [
        ["overview", "과정 개요"], ["intro", "과정소개"],
        ...(c.why ? [["why", "왜 필요한가"]] : []),
        ["recommend", "추천 대상"],
        ["features", "과정 특징"], ["ba", "교육 전·후"], ["curriculum", "커리큘럼"],
        ["instructor", "책임 강사"], ["faq", "자주 묻는 질문"], ["reviews", "수강후기"]
      ];
      const sn = {}; sections.forEach(([id], i) => { sn[id] = String(i + 1).padStart(2, "0"); });
      document.getElementById("toc").innerHTML =
        `<h4>목차</h4>${sections.map(([id, label], i) => `<a href="#${id}" data-id="${id}">${String(i + 1).padStart(2, "0")}. ${escapeHtml(label)}</a>`).join("")}<div class="apply-btn"><a class="btn btn--primary btn--lg" href="#">수강신청</a></div>`;

      const list = (arr) => arr.map((x) => `<li>${escapeHtml(x)}</li>`).join("");
      document.getElementById("longform").innerHTML = `
        <section class="lf-block" id="overview"><span class="sec-no">${sn.overview}</span><h2>과정 개요</h2>
          <dl class="info-dl">
            <dt>한 줄 정의</dt><dd>${escapeHtml(c.summary)}</dd>
            <dt>교육기간</dt><dd>${escapeHtml(c.duration)}</dd>
            <dt>교육일시</dt><dd>${escapeHtml(c.schedule)}</dd>
            <dt>교육대상</dt><dd>${escapeHtml(c.target)}</dd>
            <dt>수강료</dt><dd>${escapeHtml(c.fee)}</dd>
            <dt>접수기간</dt><dd>상시 모집 (기수별 운영)</dd>
          </dl></section>
        <section class="lf-block" id="intro"><span class="sec-no">${sn.intro}</span><h2>과정소개</h2>${c.intro.map((p) => `<p>${escapeHtml(p)}</p>`).join("")}</section>
        ${c.why ? `<section class="lf-block" id="why"><span class="sec-no">${sn.why}</span><h2>왜 이 과정이 필요한가</h2><ul class="rec-list">${list(c.why)}</ul></section>` : ""}
        <section class="lf-block" id="recommend"><span class="sec-no">${sn.recommend}</span><h2>이런 분께 추천합니다</h2><ul class="rec-list">${list(c.recommend)}</ul></section>
        <section class="lf-block" id="features"><span class="sec-no">${sn.features}</span><h2>과정 특징</h2><ul class="feat-list">${list(c.features)}</ul></section>
        <section class="lf-block" id="ba"><span class="sec-no">${sn.ba}</span><h2>교육 전 · 교육 후</h2>
          <table class="ba-table"><thead><tr><th>교육 전</th><th>교육 후</th></tr></thead><tbody>${c.beforeAfter.map((r) => `<tr><td>${escapeHtml(r[0])}</td><td>${escapeHtml(r[1])}</td></tr>`).join("")}</tbody></table></section>
        <section class="lf-block" id="curriculum"><span class="sec-no">${sn.curriculum}</span><h2>주차별 커리큘럼</h2>
          <table class="curri-table"><thead><tr><th>구분</th><th>주제</th><th>주요 내용</th></tr></thead><tbody>${c.curriculum.map((r) => `<tr><td>${escapeHtml(r[0])}</td><td><strong>${escapeHtml(r[1])}</strong></td><td>${escapeHtml(r[2])}</td></tr>`).join("")}</tbody></table></section>
        <section class="lf-block" id="instructor"><span class="sec-no">${sn.instructor}</span><h2>책임 강사</h2>
          <div class="instructor"><div class="photo"><img src="https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=400&q=80" alt="책임 강사"></div>
          <div><h4>Times Education 전문 강사진</h4><ul><li>교육과정 설계 및 강사 양성 실무</li><li>AI 교육 콘텐츠 제작 및 현장 적용</li><li>수료 포트폴리오 피드백 운영</li></ul></div></div></section>
        <section class="lf-block" id="faq"><span class="sec-no">${sn.faq}</span><h2>자주 묻는 질문</h2>
          <div class="faq-list">${c.faq.map(([q, a], i) => `<div class="faq-item"><button class="faq-q" type="button" aria-expanded="false"><span class="q-no">${String(i + 1).padStart(2, "0")}</span><span class="q-txt">${escapeHtml(q)}</span><span class="arrow">+</span></button><div class="faq-a"><p>${escapeHtml(a)}</p></div></div>`).join("")}</div></section>
        <section class="lf-block" id="reviews"><span class="sec-no">${sn.reviews}</span><h2>수강후기</h2>
          <div class="review-grid">${c.reviews.map(([q, p, who]) => `<article class="review-card"><blockquote>${escapeHtml(q)}</blockquote><p>${escapeHtml(p)}</p><div class="review-meta"><span>${escapeHtml(who)}</span><span>·</span><span class="course">${escapeHtml(c.title)}</span></div></article>`).join("")}</div></section>`;

      document.querySelectorAll(".faq-q").forEach((b) => b.addEventListener("click", () => {
        const it = b.parentElement; it.classList.toggle("open"); b.setAttribute("aria-expanded", it.classList.contains("open") ? "true" : "false");
      }));

      // 목차 스크롤스파이
      const tocLinks = document.querySelectorAll("#toc a[data-id]");
      const map = {}; tocLinks.forEach((a) => map[a.dataset.id] = a);
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) { tocLinks.forEach((a) => a.classList.remove("active")); if (map[e.target.id]) map[e.target.id].classList.add("active"); } });
      }, { rootMargin: "-20% 0px -70% 0px" });
      sections.forEach(([id]) => { const el = document.getElementById(id); if (el) obs.observe(el); });
    })();
  </script>
</body>
</html>
